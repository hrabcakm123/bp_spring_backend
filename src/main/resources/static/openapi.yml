  schemas:
    AuthenticationRequestDTO:
      type: object
      description: Request body used for user authentication, containing user credentials.
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: The user's email address. (cannot be null and must be valid)
          example: johndoe@example.com
        password:
          type: string
          description: The user's password. (cannot be null or blank)
          example: SecurePassword123!
    AuthentificationResponseDTO:
      type: object
      description: Response returned after successful authentication, containing a JWT access token for further authorized requests.
      required:
        - token
      properties:
        token:
          type: string
          description: The JWT token is returned upon successful user authentication. This token must be included in the
            Authorization header of all subsequent requests to protected endpoints. The token contains user claims
            and is signed by the server, ensuring both authenticity and data integrity. It has an expiration time
            after which the user must authenticate again.
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ0ZWFjaGVyQHRlYWNoZXIudGVhY2hlciIsImlkIjoyLCJyb2xlIjoiVEVBQ0hFUiIsImlhdCI6MTc1NDc3MjEzNCwiZXhwIjoxNzU0ODU4NTM0fQ.WDoxJcw3zFlxV7SLLD-joZ7l-eLERvLtE_FIjK1_YoM"
    ErrorResponseDTO:
      type: object
      description: Represents a standard error response containing status code, general message, and optional list of detailed error messages.
      required:
        - status
        - message
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code representing the error.
          example: 4xx
        message:
          type: string
          description: A short description or summary of the error.
          example: Descriptive summary of the error.
        errors:
          type: array
          items:
            type: string
          description: A list of detailed error messages.
          example: [
            "Detailed error message #1",
            "Detailed error message #2"
          ]
    UserRequestDTO:
      type: object
      description: Request body used for creating new user or updating existing user.
      properties:
        firstname:
          type: string
          description: The user's first name. (OnCreate -> cannot be null or blank, OnUpdate -> cannot be blank)
          example: John
        lastname:
          type: string
          description: The user's last name. (OnCreate -> cannot be null or blank, OnUpdate -> cannot be blank)
          example: Doe
        email:
          type: string
          description: The user's email address. (Must be unique, OnCreate -> cannot be null and must be valid, OnUpdate -> cannot be blank and if not null then must be valid)
          example: johndoe@example.com
        password:
          type: string
          description: The user's password (OnCreate -> cannot be null or blank, OnUpdate -> cannot be blank).
          example: SecurePassword123!
        role:
          type: string
          description: The user's role within the system, determining access level and permissions. (OnCreate -> cannot be null and must be ADMIN, TEACHER or HELPER, OnUpdate -> if not null then must be ADMIN, TEACHER or HELPER)
          example: TEACHER
    StudentRequestDTO:
      type: object
      description: Request body used for creating new student or updating existing student.
      properties:
        aisId:
          type: integer
          format: int32
          description: The student's AIS ID. (OnCreate -> cannot be null or blank)
          example: 123456
        firstname:
          type: string
          description: The student's first name. (OnCreate -> cannot be null or blank, OnUpdate -> cannot be blank)
          example: John
        lastname:
          type: string
          description: The student's last name. (OnCreate -> cannot be null or blank, OnUpdate -> cannot be blank)
          example: Doe
        email:
          type: string
          description: The student's email address. (Must be unique, OnCreate -> cannot be null and must be valid, OnUpdate -> cannot be blank and if not null then must be valid)
          example: johndoe@example.com
    BlockRequestDTO:
      type: object
      description: Request body used for creating new block or updating existing block.
      properties:
        name:
          type: string
          description: The block's name. (OnCreate -> cannot be null or blank, OnUpdate -> cannot be blank)
          example: Block 1
        maxPoints:
          type: number
          format: double
          description: The maximum number of points for the block. (must be positive, OnCreate -> cannot be null)
          example: 25.0
        requiredPoints:
          type: number
          format: double
          description: The required points to pass the block. (must be zero or positive, must be less than or equal to maxPoints, OnCreate -> cannot be null)
          example: 15.0
    ExerciseRequestDTO:
      type: object
      description: Request body used for creating new exercise or updating existing exercise.
      properties:
        dayOfWeek:
          type: string
          description: The day of the week. (OnCreate → cannot be null)
          example: MONDAY
        startTime:
          type: string
          format: time
          description: Start time of the exercise. (OnCreate → cannot be null)
          example: 09:00:00
        endTime:
          type: string
          format: time
          description: End time of the exercise. (endTime must be after startTime, OnCreate → cannot be null)
          example: 10:30:00
        roomEnum:
          type: string
          description: Room where the exercise takes place. (OnCreate → cannot be null)
          example: CPUC
    AssignmentRequestDTO:
      type: object
      description: Request body used for creating new assignment or updating existing assignment.
      properties:
        blockId:
          type: integer
          format: int32
          description: The unique identifier for the block associated with the assignment. (OnCreate -> must be present and positive)
          example: 1
        name:
          type: string
          description: The assignment's name. (OnCreate -> cannot be null or blank, OnUpdate -> cannot be blank)
          example: Assignment 1
        note:
          type: string
          description: Optional notes or additional information about the assignment. (OnUpdate -> cannot be blank if present)
          example: Assignment 1 note
        maxPoints:
          type: number
          format: double
          description: The maximum number of points for the assignment. (must be positive, OnCreate -> cannot be null)
          example: 25.0
    SuccessResponseDTO:
      type: object
      description: Represents a standard success response containing status code, general message, and optional list of updated or deleted data.
      required:
        - status
        - message
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code representing the success.
          example: 2xx
        message:
          type: string
          description: A short description or summary of the success.
          example: Descriptive summary of the success.
        data:
          type: array
          items:
            type: object
          description: A list of updated or deleted data.
          example: [
            {
              "id": 1,
              "firstname": "John",
              "lastname": "Doe",
              "email": "john.doe@example.com",
              "roleEnum": "TEACHER"
            },
            {
              "id": 2,
              "firstname": "Jane",
              "lastname": "Smith",
              "email": "jane.smith@example.com",
              "roleEnum": "TEACHER"
            }
          ]
    UserResponseDTO:
      type: object
      description: Response body that returns details about a user.
      required:
        - id
        - firstname
        - lastname
        - email
        - role
      properties:
        id:
