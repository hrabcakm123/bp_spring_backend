  /api/v1/student-assignment/grading:
    get:
      tags:
        - StudentAssignmentController
      summary: Retrieve grouped student assignments for grading
      description: >
        This endpoint allows you to fetch a list of student assignments grouped by student, with optional sorting and filtering.
      
        - **Sorting** is available for all fields of `StudentAssignmentGroupedItemsResponseDTO`. 
          - **Note:** Sorting works only when both `exerciseId` and `blockId` are provided together.
        
        - **Filtering** is available for `blockId`, `studentId`, and `exerciseId`.  
          - If `studentId` is provided, only the assignments for that student are returned.  
          - If `exerciseId` is provided, assignments for all students for that exercise are returned. 
          - If `exerciseId` is provided, optional filter `studentFullName` can be used to retrieve assignments only for students whose full name contains the given value (case-insensitive).  
          - At least one of `studentId` or `exerciseId` must be provided.
      operationId: getStudentAssignmentGroupedItems
      parameters:
        - $ref: '#/components/parameters/sort'
        - name: blockId
          in: query
          description: Filter by block ID (required).
          required: true
          schema:
            type: integer
            format: int32
        - name: studentId
          in: query
          description: Optional filter to retrieve assignments for a specific student.
          required: false
          schema:
            type: integer
            format: int32
        - name: exerciseId
          in: query
          description: Optional filter to retrieve assignments for a specific exercise.
          required: false
          schema:
            type: integer
            format: int32
        - name: studentFullName
          in: query
          description: Optional filter to retrieve assignments for students whose full name contains this value (case-insensitive). Only applicable if `exerciseId` is provided.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK - List of student assignments grouped by student returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentAssignmentGroupedItemsResponseDTO'
        '401':
          description: Unauthorized - Authentication is required to access this resource.
        '403':
          description: "Forbidden - Access denied: You do not have permission to perform this action."
        '405':
          description: Method Not Allowed - Incorrect HTTP method used.
        '422':
          description: Either studentId or exerciseId must be provided.
        '500':
          description: Required request parameter is not present.
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
