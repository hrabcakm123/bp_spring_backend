components:
  parameters:
    sort:
      name: sort
      in: query
      required: false
      description: >
        Sort the results by none or any field from the corresponding `Request/ResponseDTO`.
        Format: `field,(asc|desc)` >>> for example: `id,asc` or `id,desc`.
        If no order is specified, default is ascending.  
        Multiple sort parameters can be included, like:  
        `sort=field1,asc&sort=field2,desc`
      schema:
        type: string
  schemas:
    AuthenticationRequestDTO:
      type: object
      description: Request body used for user authentication, containing user credentials.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: The user's email address.
        password:
          type: string
          description: The user's password.
    AuthentificationResponseDTO:
      type: object
      description: Response returned after successful authentication, containing a JWT access token for further authorized requests.
      required:
        - token
      properties:
        token:
          type: string
          format: JWT token
          description: The JWT token is returned upon successful user authentication. This token must be included in the
            Authorization header of all subsequent requests to protected endpoints. The token contains user claims
            and is signed by the server, ensuring both authenticity and data integrity. It has an expiration time
            after which the user must authenticate again.
    ErrorResponseDTO:
      type: object
      description: Represents a standard error response containing status code, general message, and optional list of detailed error messages.
      required:
        - status
        - message
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code representing the error.
        message:
          type: string
          description: A short description or summary of the error.
        errors:
          type: array
          items:
            type: string
          description: A list of detailed error messages.
    UserRequestDTO:
      type: object
      description: Request body used for creating new user or updating existing user.
      required:
        - fullName
        - email
        - roleEnum
      properties:
        fullName:
          type: string
          description: The user's full name (including degrees, first name, middle name, last name).
        email:
          type: string
          format: email
          description: The user's email address.
        roleEnum:
          type: string
          enum: [ ADMIN, TEACHER, HELPER ]
          description: The user's role within the system, determining access level and permissions.
    StudentRequestDTO:
      type: object
      description: Request body used for creating new student or updating existing student.
      required:
        - aisId
        - fullName
      properties:
        aisId:
          type: integer
          format: int32
          description: The student's AIS ID.
        fullName:
          type: string
          description: The student's full name (including degrees, first name, middle name, last name).
    StudentToExerciseRequestDTO:
      type: object
      description: Request body used for assigning multiple students to a specific exercise.
      required:
        - exerciseId
        - students
      properties:
        exerciseId:
          type: integer
          format: int32
          description: ID of the exercise to which the students will be added.
        students:
          type: array
          description: List of students to assign.
          items:
            $ref: '#/components/schemas/StudentRequestDTO'
    BlockRequestDTO:
      type: object
      description: Request body used for creating new block or updating existing block.
      required:
        - name
        - maxPoints
        - requiredPoints
      properties:
        name:
          type: string
          description: The block's name.
        maxPoints:
          type: number
          format: double
          description: The maximum number of points for the block.
        requiredPoints:
          type: number
          format: double
          description: The required points to pass the block.
    ExerciseRequestDTO:
      type: object
      description: Request body used for creating new exercise or updating existing exercise.
      required:
        - firstSessionDate
        - startTime
        - roomEnum
      properties:
        firstSessionDate:
          type: LocalDate
          description: Date when first session of this exercise starts.
        startTime:
          type: string
          format: time
          description: Start time of the exercise.
        roomEnum:
          type: string
          description: The room where the exercise takes place.
    AssignmentRequestDTO:
      type: object
      description: Request body used for creating new assignment or updating existing assignment.
      required:
        - blockId
        - name
        - maxPoints
      properties:
        blockId:
          type: integer
          format: int32
          description: The unique identifier for the block associated with the assignment.
        name:
          type: string
          description: The assignment's name.
        maxPoints:
          type: number
          format: double
          description: The maximum number of points for the assignment.
    UserExerciseRequestDTO:
      type: object
      description: Request body used for creating new userExercise or updating existing userExercise.
      required:
        - userId
        - exerciseId
      properties:
        userId:
          type: integer
          format: int32
          description: The unique identifier for the user associated with the userExercise.
        exerciseId:
          type: integer
          format: int32
          description: The unique identifier for the exercise associated with the userExercise.
    StudentExerciseRequestDTO:
      type: object
      description: Request body used for creating new studentExercise or updating existing studentExercise.
      required:
        - studentId
        - exerciseId
      properties:
        studentId:
          type: integer
          format: int32
          description: The unique identifier for the student associated with the studentExercise.
        exerciseId:
          type: integer
          format: int32
          description: The unique identifier for the exercise associated with the userExercise.
    ExerciseSessionRequestDTO:
      type: object
      description: Request body used for creating new exerciseSession or updating existing exerciseSession.
      required:
        - exerciseId
        - sessionDate
      properties:
        exerciseId:
          type: integer
          format: int32
          description: The unique identifier for the exercise associated with the exerciseSession.
        sessionDate:
          type: string
          description: The date when the exercise session took place.
    StudentAssignmentRequestDTO:
      type: object
      description: Request body used for creating new studentAssignment or updating existing studentAssignment.
      required:
        - assignmentId
        - studentId
        - earnedPoints
      properties:
        assignmentId:
          type: integer
          format: int32
          description: The unique identifier for the assignment associated with the studentAssignment.
        studentId:
          type: integer
          format: int32
          description: The unique identifier for the student associated with the studentAssignment.
        note:
          type: string
          description: Optional reason why certain amount of points was assigned.
        earnedPoints:
          type: number
          format: double
          description: The number of points the student earned for the given assignment.
    StudentAttendanceRequestDTO:
      type: object
      description: Request body used for creating new studentAttendance or updating existing studentAttendance.
      required:
        - studentId
        - exerciseSessionId
        - attendanceEnum
      properties:
        studentId:
          type: integer
          format: int32
          description: The unique identifier for the student associated with the studentAttendance.
        exerciseSessionId:
          type: integer
          format: int32
          description: The unique identifier for the exerciseSession associated with the studentAttendance.
        attendanceEnum:
          type: string
          enum: [ PRESENT, ABSENT, SUBSTITUTED ]
          description: The student's attendance status.
    SuccessResponseDTO:
      type: object
      description: Represents a standard success response containing status code, general message, and optional list of data.
      required:
        - status
        - message
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code representing the success.
        message:
          type: string
          description: A short description or summary of the success.
        data:
          type: array
          items:
            type: object
          description: A list of updated or deleted data.
    UserResponseDTO:
      type: object
      description: Response body that returns details about a user.
      required:
        - id
        - fullName
        - email
        - roleEnum
      properties:
        id:
          type: integer
          format: int32
          description: The users's id.
        fullName:
          type: string
          description: The user's full name (including degrees, first name, middle name, last name).
        email:
          type: string
          format: email
          description: The user's email address.
        roleEnum:
          type: string
          enum: [ ADMIN, TEACHER, HELPER ]
          description: The user's role within the system, determining access level and permissions.
    StudentResponseDTO:
      type: object
      description: Response body that returns details about a student.
      required:
        - id
        - aisId
        - fullName
      properties:
        id:
          type: integer
          format: int32
          description: The student's id.
        aisId:
          type: integer
          format: int32
          description: The student's AIS ID.
        fullName:
          type: string
          description: The student's full name (including degrees, first name, middle name, last name).
    BlockResponseDTO:
      type: object
      description: Response body that returns details about a block.
      required:
        - id
        - name
        - maxPoints
        - requiredPoints
      properties:
        id:
          type: integer
          format: int32
          description: The block's id.
        name:
          type: string
          description: The block's name.
        maxPoints:
          type: number
          format: double
          description: The maximum number of points the block can have.
        requiredPoints:
          type: number
          format: double
          description: The required points to pass the block, which must be less than or equal to maxPoints.
    ExerciseResponseDTO:
      type: object
