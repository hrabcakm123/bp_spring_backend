      description: >
        This endpoint allows you to search for students by a query string.  

        - **Sorting** is available for all fields defined in `StudentResponseDTO`.  
        
        - **Filtering** is available via the `q` query parameter.
      operationId: searchStudents
      parameters:
        - $ref: '#/components/parameters/sort'
        - name: q
          in: query
          description: Search query string to find matching students.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK - List of matching students returned.
          content:
