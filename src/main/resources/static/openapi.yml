        lastname:
          type: string
          description: The student's last name.
          example: Doe
        email:
          type: string
          description: The student's email address.
          example: johndoe@example.com
    BlockResponseDTO:
      type: object
      description: Response body that returns details about a block.
      required:
        - id
        - name
        - maxPoints
        - requiredPoints
      properties:
        id:
          type: integer
          format: int32
          description: The block's id.
          example: 1
        name:
          type: string
          description: The block's name.
          example: Block 1
        maxPoints:
          type: number
          format: double
          description: The maximum number of points the block can have.
          example: 25.0
        requiredPoints:
          type: number
          format: double
          description: The required points to pass the block, which must be less than or equal to maxPoints.
          example: 15.0
    ExerciseResponseDTO:
      type: object
      description: Response body that returns details about an exercise.
      required:
        - id
        - dayOfWeek
        - startTime
        - endTime
        - roomEnum
      properties:
        id:
          type: integer
          format: int32
          description: The exercise's unique identifier.
          example: 1
        dayOfWeek:
          type: string
          enum: [ MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY ]
          description: The day of the week when the exercise takes place.
          example: MONDAY
        startTime:
          type: string
          format: time
          description: The starting time of the exercise.
          example: 09:00:00
        endTime:
          type: string
          format: time
          description: The ending time of the exercise.
          example: 10:30:00
        roomEnum:
          type: string
          enum: [ CPUA, CPUC, CPUE ]
          description: The room where the exercise takes place.
          example: CPUA
    AssignmentResponseDTO:
      type: object
      description: Response body that returns details about an assignment.
      required:
        - id
        - block
        - name
        - note
        - maxPoints
      properties:
        id:
          type: integer
          format: int32
          description: The assignment's id.
          example: 1
        block:
          type: object
          description: Details about the block to which the assignment belongs.
          example: {
            "id": 2,
            "name": "Block 2",
            "maxPoints": 25.0,
            "requiredPoints": 15.0
          }
        name:
          type: string
          description: The assignment's name.
          example: Assignment 1
        note:
          type: string
          description: Optional notes or additional information about the assignment.
          example: Assignment 1 note.
        maxPoints:
          type: number
          format: double
          description: The maximum number of points the assignment can have.
          example: 25.0
