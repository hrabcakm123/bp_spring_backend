          description: The user's first name.
          example: John
        lastname:
          type: string
          description: The user's last name.
          example: Doe
        email:
          type: string
          description: The user's email address.
          example: johndoe@example.com
        role:
          type: string
          description: The user's role within the system, determining access level and permissions.
          example: TEACHER
    StudentResponseDTO:
      type: object
      description: Response body that returns details about a student.
      required:
        - id
        - aisId
        - firstname
        - lastname
        - email
      properties:
        id:
          type: integer
          format: int32
          description: The student's id.
          example: 1
        aisId:
          type: integer
          format: int32
          description: The student's AIS ID.
