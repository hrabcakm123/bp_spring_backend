paths:
  /api/v1/auth/authenticate:
    post:
      tags:
        - AuthenticationController
      summary: Authenticate user
      description: Allows a user to authenticate by providing their email and password. Upon success, returns a JWT token to use for accessing protected resources.
      operationId: authenticate
      requestBody:
        description: User credentials for authentication.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequestDTO'
        required: true
      responses:
        '200':
          description: OK - User successfully authenticated, JWT token returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthentificationResponseDTO'
        '400':
          description: Bad Request - Required request body is missing - Bad JSON format.
        '401':
          description: Unauthorised - Bad credentials.
        '405':
          description: Method Not Allowed - Incorrect HTTP method used.
        '409':
          description: Conflict - The request could not be processed due to data integrity rules violation.
        '422':
          description: Unprocessable Entity - Validation Failed.
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
  /api/v1/user:
    get:
      tags:
        - UserController
      summary: Retrieve a list of users
      description: >
        This endpoint allows you to fetch a list of users with optional sorting and filtering.
        
        - **Sorting** is available for all fields defined in `UserRequestDTO` (including `id`).
        
        - **Filtering** is available for `id` and `email` (can be used at the same time).
      operationId: getUsersByCriteria
      parameters:
        - $ref: '#/components/parameters/sort'
        - name: id
          in: query
          description: Filter users by ID.
          required: false
          schema:
            type: integer
            format: int32
        - name: email
          in: query
          description: Filter users by email address.
          required: false
          schema:
            type: string
            format: email
      responses:
        '200':
          description: OK - List of users returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDTO'
        '401':
          description: "Unauthorised - Unauthenticated: Authentication is required to access this resource."
        '403':
          description: "Forbidden - Access denied: You do not have permission to perform this action."
        '405':
          description: Method Not Allowed - Incorrect HTTP method used.
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
    post:
      tags:
        - UserController
      summary: Create a new user/users
      description: Adds a new user/users to the system with the provided details.
      operationId: addUsers
      requestBody:
        description: Array of user objects that need to be created.
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserRequestDTO'
        required: true
      responses:
        '201':
          description: Created - Users created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseDTO'
        '400':
          description: Bad Request - Required request body is missing - Bad JSON format.
        '401':
          description: "Unauthorised - Unauthenticated: Authentication is required to access this resource."
        '403':
          description: "Forbidden - Access denied: You do not have permission to perform this action."
        '405':
          description: Method Not Allowed - Incorrect HTTP method used.
        '409':
          description: Conflict - The request could not be processed due to data integrity rules violation.
        '422':
          description: Unprocessable Entity - Validation Failed.
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
    put:
      tags:
        - UserController
      summary: Update user by ID
      description: Updates information for an existing user identified by their ID.
      operationId: updateUserById
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user.
          schema:
            type: integer
            format: int32
      requestBody:
        description: User object with updated fields.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestDTO'
        required: true
      responses:
        '200':
          description: OK - User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseDTO'
        '400':
          description: Bad Request - Required request body is missing - Bad JSON format.
        '401':
          description: "Unauthorised - Unauthenticated: Authentication is required to access this resource."
        '403':
          description: "Forbidden - Access denied: You do not have permission to perform this action."
        '404':
          description: Not Found - User not found.
        '405':
          description: Method Not Allowed - Incorrect HTTP method used.
        '409':
          description: Conflict - The request could not be processed due to data integrity rules violation.
        '422':
          description: Unprocessable Entity - Validation Failed.
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
    delete:
      tags:
        - UserController
      summary: Delete user by ID
      description: Removes a user from the system identified by their ID.
      operationId: deleteUserById
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK - User deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseDTO'
        '401':
          description: "Unauthorised - Unauthenticated: Authentication is required to access this resource."
        '403':
          description: "Forbidden - Access denied: You do not have permission to perform this action."
        '404':
          description: Not Found - User not found.
        '405':
          description: Method Not Allowed - Incorrect HTTP method used.
        '409':
          description: Conflict - The request could not be processed due to data integrity rules violation.
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
