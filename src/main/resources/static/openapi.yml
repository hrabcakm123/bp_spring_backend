  /api/v1/student-attendance/attendance:
    get:
      tags:
        - StudentAttendanceController
      summary: Retrieve grouped student attendances
      description: >
        This endpoint returns grouped attendance records for students.  

        - **Filtering** is available for `exerciseId` and `studentId`.  
          - If `studentId` is provided, only attendance records for that specific student are returned.  
          - If `exerciseId` is provided, attendance for all students assigned to that exercise is returned.  
          - **Exactly one of `studentId` or `exerciseId` must be provided.**  
          - **Both parameters cannot be used together.**

        - **Sorting** is available for all fields of `StudentAttendanceGroupedItemsResponseDTO`.
          Sorting is applied to the final grouped output.

        - **Current week filtering (`current`)**:  
          - If set to `true`, only attendance records belonging to sessions in the current week and year are returned.  
          - Defaults to `false`.

        - **Grouping** is performed by student full name.  
          Each student object contains a list of attendance records.

      operationId: getStudentAttendanceGroupedItems
      parameters:
        - $ref: '#/components/parameters/sort'
        - name: exerciseId
          in: query
          description: Optional filter. Returns attendances for all students related to this exercise.
            Cannot be used together with `studentId`.
          required: false
          schema:
            type: integer
            format: int32
        - name: studentId
          in: query
          description: Optional filter. Returns attendances only for the specified student.
            Cannot be used together with `exerciseId`.
          required: false
          schema:
            type: integer
            format: int32
        - name: current
          in: query
          description: >
            Optional filter.  
            If set to `true`, returns only attendances belonging to sessions in the current calendar week.  
            Defaults to `false`.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK - Grouped student attendances returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentAttendanceGroupedItemsResponseDTO'
        '401':
          description: Unauthorized - Authentication is required to access this resource.
        '403':
          description: "Forbidden - Access denied: You do not have permission to perform this action."
        '405':
          description: Method Not Allowed - Incorrect HTTP method used.
        '422':
          description: Either exerciseId or studentId must be provided (but not both at the same time).
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
