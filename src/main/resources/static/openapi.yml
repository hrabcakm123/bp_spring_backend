    StudentAssignmentLogResponseDTO:
      type: object
      description: Response body that returns details about a log of a studentAssignment point update.
      required:
        - id
        - studentAssignment
        - originalPoints
        - updatedPoints
        - originalUser
        - updatedByUser
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
          description: The ID of the log entry.
        studentAssignment:
          $ref: '#/components/schemas/StudentAssignmentResponseDTO'
          description: The studentAssignment associated with this log.
        originalPoints:
          type: number
          format: double
          description: The points that were originally set.
        updatedPoints:
          type: number
          format: double
          description: The points after the update.
        originalUser:
          $ref: '#/components/schemas/UserResponseDTO'
          description: The user who originally set the points (admin or teacher).
        updatedByUser:
          $ref: '#/components/schemas/UserResponseDTO'
          description: The user who updated the points (helper).
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the points were updated.